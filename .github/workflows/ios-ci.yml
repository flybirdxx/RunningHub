name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/kmp-refactoring

jobs:
  ios:
    name: iOS simulator checks
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run iOS L1 verification
        run: ./gradlew verifyL1Ios
