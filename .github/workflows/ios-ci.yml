name: iOS CI

on:
  workflow_dispatch:
    inputs:
      simulator_smoke_pass:
        description: "Confirm that macOS Simulator login, logout/session, and QuickCreate smoke were verified for this run."
        required: true
        type: boolean
        default: false
      smoke_notes:
        description: "Simulator device, OS version, and checked login/logout/QuickCreate path."
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator checks
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate iOS migration scripts
        run: |
          bash -n docs/migration/collect-ios-macos-evidence.sh
          bash -n docs/migration/run-ios-simulator-smoke.sh
          bash docs/migration/collect-ios-macos-evidence.sh --self-test
          bash docs/migration/run-ios-simulator-smoke.sh --self-test

      - name: Run iOS L1 verification
        run: ./gradlew verifyL1Ios

      - name: Run iOS Native unit tests
        run: |
          ./gradlew \
            :core:network:iosSimulatorArm64Test \
            :feature:auth:domain:iosSimulatorArm64Test \
            :feature:auth:data:iosSimulatorArm64Test \
            :feature:quickcreate:presentation:iosSimulatorArm64Test

      - name: Run Xcode Debug build
        run: |
          rm -rf build/xcode/RunningHub.xcresult build/xcode/DerivedData
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme RunningHub \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/xcode/DerivedData \
            -resultBundlePath build/xcode/RunningHub.xcresult \
            build CODE_SIGNING_ALLOWED=NO

      - name: Run iOS Simulator launch smoke
        run: |
          bash docs/migration/run-ios-simulator-smoke.sh \
            --app-path build/xcode/DerivedData/Build/Products/Debug-iphonesimulator/RunningHub.app \
            --bundle-id com.runninghub.app.ios \
            --output build/xcode/simulator-launch-smoke.txt

      - name: Upload iOS verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            build/xcode/**
          if-no-files-found: ignore

      - name: Validate L1 seal evidence inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          SIMULATOR_SMOKE_PASS: ${{ inputs.simulator_smoke_pass }}
          SMOKE_NOTES: ${{ inputs.smoke_notes }}
        run: |
          if [ "$SIMULATOR_SMOKE_PASS" != "true" ]; then
            echo "simulator_smoke_pass must be true before collecting L1 iOS evidence." >&2
            exit 1
          fi
          if [ -z "${SMOKE_NOTES//[[:space:]]/}" ]; then
            echo "smoke_notes must describe the Simulator device, OS, and checked flows." >&2
            exit 1
          fi

      - name: Collect L1 iOS evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          SMOKE_NOTES: ${{ inputs.smoke_notes }}
        run: |
          docs/migration/collect-ios-macos-evidence.sh \
            --simulator-smoke-pass \
            --smoke-notes "$SMOKE_NOTES"

      - name: Upload L1 iOS evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ios-macos-link-and-simulator
          path: docs/migration/evidence/ios-macos-link-and-simulator.md
